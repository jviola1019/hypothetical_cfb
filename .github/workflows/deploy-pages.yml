name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh FBS 2023–26 forecasts, 2025–26 player events and rosters", "Refresh 2026 week-scoped player roles"]
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for the Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts?per_page=100"
          for attempt in range(1, 13):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      results = json.load(response).get("artifacts", [])
                  if any(item.get("name") == "github-pages" and not item.get("expired", False) for item in results):
                      print(f"Pages artifact visible on attempt {attempt}")
                      time.sleep(3)
                      break
                  print(f"Pages artifact not yet indexed ({attempt}/12)")
              except Exception as exc:
                  print(f"Artifact lookup retry {attempt}/12: {type(exc).__name__}")
              time.sleep(5)
          else:
              raise SystemExit("Pages artifact not discoverable; no deployment attempted")
          PYCODE
      - id: deployment
        uses: actions/deploy-pages@v4
