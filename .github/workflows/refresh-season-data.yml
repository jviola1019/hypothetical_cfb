name: Refresh FBS 2023–26 forecasts, 2025–26 player events and rosters
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-season-data.yml'
      - 'scripts/import_2026_rosters.py'
      - 'scripts/import_season_schedules.py'
      - 'scripts/evaluate_rolling_model.py'
      - 'scripts/import_2025_rosters.py'
      - 'scripts/trim_2025_rosters.py'
      - 'scripts/import_player_games.py'
      - 'scripts/evaluate_multiyear.py'
      - 'scripts/evaluate_score_distribution.py'
      - 'scripts/player_event_model.py'
  schedule:
    - cron: '27 13 * * 1'
permissions:
  contents: write
concurrency:
  group: gridiron-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch public historical and 2026 FBS reference snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gridiron-ingest
          for year in 2025 2026; do
            curl --fail --location --retry 3 --max-time 75 --proto '=https' --tlsv1.2 \
              "https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/schedules/csv/cfb_schedules_${year}.csv" \
              -o "/tmp/gridiron-ingest/schedules-${year}.csv"
            python scripts/import_season_schedules.py --season "$year" \
              --csv "/tmp/gridiron-ingest/schedules-${year}.csv" \
              --out "public/data/season-${year}.json"
          done
      - name: Fetch 2026 roster snapshots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/rosters/csv/cfb_rosters_2026.csv' \
            -o /tmp/gridiron-ingest/cfbd-rosters-2026.csv
          # Weekly school roster release is a newer optional supplement. A failed
          # download does not invalidate the separately verified CFBD roster.
          curl --fail --location --retry 1 --max-time 130 --proto '=https' --tlsv1.2 \
            'https://github.com/fakhar-ud-din/ncaapyscraper/releases/latest/download/ncaapyscraper-data.zip' \
            -o /tmp/gridiron-ingest/ncaapyscraper-weekly.zip || rm -f /tmp/gridiron-ingest/ncaapyscraper-weekly.zip
          python scripts/import_2026_rosters.py \
            --schedule public/data/season-2026.json \
            --cfbd-roster /tmp/gridiron-ingest/cfbd-rosters-2026.csv \
            --weekly-zip /tmp/gridiron-ingest/ncaapyscraper-weekly.zip \
            --out public/data/rosters-2026.json
      - name: Validate and refresh 2025 CC0 roster archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/Dharit13/NCAA_2025-26-Season-Dataset/main/by_sport/football/all.csv' \
            -o /tmp/gridiron-ingest/ncaa-2025-all.csv
          curl --fail --location --retry 2 --max-time 90 --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/Dharit13/NCAA_2025-26-Season-Dataset/main/by_sport/football/stats.csv' \
            -o /tmp/gridiron-ingest/ncaa-2025-stats.csv
          python scripts/import_ncaa_roster.py --roster /tmp/gridiron-ingest/ncaa-2025-all.csv \
            --stats /tmp/gridiron-ingest/ncaa-2025-stats.csv --out /tmp/gridiron-ingest/ncaa-2025-raw.json
          # This 2025 source uses the same season as the roster: never carry a
          # historical 2025 player forward into the default 2026 season.
          curl --fail --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/rosters/csv/cfb_rosters_2025.csv' \
            -o /tmp/gridiron-ingest/cfbd-rosters-2025.csv
          python scripts/import_2025_rosters.py \
            --schedule public/data/season-2025.json \
            --csv /tmp/gridiron-ingest/cfbd-rosters-2025.csv \
            --out public/data/rosters-2025.json
      - name: Evaluate pregame 2025-trained baseline against 2026 holdout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_rolling_model.py \
            --train-csv /tmp/gridiron-ingest/schedules-2025.csv \
            --holdout-csv /tmp/gridiron-ingest/schedules-2026.csv \
            --out public/data/research-2026.json
      - name: Evaluate four historical seasons without 2026 parameter tuning
        shell: bash
        run: |
          set -euo pipefail
          for year in 2023 2024; do
            curl --fail --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 \
              "https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/schedules/csv/cfb_schedules_${year}.csv" \
              -o "/tmp/gridiron-ingest/schedules-${year}.csv"
          done
          python scripts/evaluate_multiyear.py \
            --schedule-2023 /tmp/gridiron-ingest/schedules-2023.csv \
            --schedule-2024 /tmp/gridiron-ingest/schedules-2024.csv \
            --schedule-2025 /tmp/gridiron-ingest/schedules-2025.csv \
            --schedule-2026 /tmp/gridiron-ingest/schedules-2026.csv \
            --out public/data/model-compare-2026.json
      - name: Evaluate score-level residual intervals (no drive-calibration claim)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_score_distribution.py \
            --schedule-2023 /tmp/gridiron-ingest/schedules-2023.csv \
            --schedule-2024 /tmp/gridiron-ingest/schedules-2024.csv \
            --schedule-2025 /tmp/gridiron-ingest/schedules-2025.csv \
            --schedule-2026 /tmp/gridiron-ingest/schedules-2026.csv \
            --out public/data/score-evaluation-2026.json
      - name: Ingest play-level 2025 and 2026 player game events
        shell: bash
        run: |
          set -euo pipefail
          for year in 2025 2026; do
            curl --fail --location --retry 2 --max-time 180 --proto '=https' --tlsv1.2 \
              "https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/player_stats/csv/player_stats_${year}.csv" \
              -o "/tmp/gridiron-ingest/player-stats-${year}.csv"
            if [[ "$year" == 2025 ]]; then
              flags=(--priors-out /tmp/gridiron-ingest/player-priors-2025.json)
            else
              flags=(--priors-in /tmp/gridiron-ingest/player-priors-2025.json
                     --evaluation-out public/data/player-model-evaluation-2026.json)
            fi
            python scripts/import_player_games.py --season "$year" \
              --csv "/tmp/gridiron-ingest/player-stats-${year}.csv" \
              --schedule-csv "/tmp/gridiron-ingest/schedules-${year}.csv" \
              --teams-json "public/data/season-${year}.json" \
              --rosters-json "public/data/rosters-${year}.json" \
              --out-dir "public/data/players-${year}" "${flags[@]}"
          done
      - name: Rebuild week-scoped lineup interpretations from verified 2026 rosters
        run: |
          python scripts/refresh_weekly_lineups.py \
            --roster public/data/rosters-2026.json \
            --players public/data/players-2026 \
            --curated research/weekly-lineups/2026-11-21.json \
            --date "$(date -u +%F)" \
            --out public/data/weekly-lineups-2026.json
      - name: Unit and ingestion tests
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
          python - <<'PY'
          import json
          for y,min_count in [(2025,136),(2026,138)]:
              o=json.load(open(f'public/data/season-{y}.json'))
              assert o['allFbsSchoolsIdentified']>=min_count, o['allFbsSchoolsIdentified']
          model=json.load(open('public/data/research-2026.json'))
          assert model['training']['season']==2025 and model['holdout']['season']==2026
          assert model['holdout']['evaluatedGames']>=300
          assert model['holdout']['calibratedElo']['n']==model['holdout']['evaluatedGames']
          print('2026 chronological holdout evaluated:',model['holdout']['calibratedElo']['brier'])
          o=json.load(open('public/data/rosters-2026.json'))
          assert o['schoolsCount']==138, o['schoolsCount']
          old=json.load(open('public/data/rosters-2025.json'))
          assert old['schoolsCount']>=100, old['schoolsCount']
          compare=json.load(open('public/data/model-compare-2026.json'))
          assert compare['gamesBySeason']['2026']>=300
          for year,schools in [(2025,136),(2026,138)]:
              player=json.load(open(f'public/data/players-{year}/manifest.json'))
              assert player['schoolFiles']>=schools and player['athletesWithRecordedEvents']>400 and player['derivedAthleteSummaries']>900
          score=json.load(open('public/data/score-evaluation-2026.json'))
          assert score['fitSeason']==2024 and score['fitGames']>=400
          assert score['evaluations']['2026']['n']>=300
          assert 0 <= score['evaluations']['2026']['margin']['interval90Coverage'] <= 1
          lineup=json.load(open('public/data/weekly-lineups-2026.json'))
          assert lineup['schools']==138 and lineup['schemaVersion']==1
          assert set(lineup['teams'])==set(json.load(open('public/data/rosters-2026.json'))['schools'])
          print('Weekly personnel coverage:',lineup['schools'])
          player_model=json.load(open('public/data/player-model-evaluation-2026.json'))
          assert player_model['trainingSeason']==2025 and player_model['evaluationSeason']==2026
          assert player_model['model']['n'] >= 100 and player_model['model']['n']==player_model['cohortPriorOnlyBaseline']['n']
          print('Evaluated 2026 event-conditioned athlete samples:',player_model['model']['n'])
          print('Validated score intervals and athlete conditional event model; neither is a possession-calibrated full-game prop model')
          PY
      - name: Synchronize release provenance after refreshing source snapshots
        run: python3 scripts/sync_data_manifest.py
      - name: Commit validated observed data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/manifest.json public/data/season-2025.json public/data/season-2026.json \
                  public/data/rosters-2025.json public/data/rosters-2026.json \
                  public/data/research-2026.json public/data/model-compare-2026.json \
                  public/data/score-evaluation-2026.json public/data/player-model-evaluation-2026.json \
                  public/data/players-2025/ public/data/players-2026/ \
                  public/data/weekly-lineups-2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh 2025–2026 observed FBS records and roster snapshots'
            # Safely incorporate weekly updates that arrived during the lengthy fetch.
            # Never force-push over a newer live data snapshot.
            # A concurrent developer commit may arrive between fetch and push.
            # Retry safely without ever force-overwriting newer source or data.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo 'Data publication blocked by repeated concurrent updates' >&2
                exit 1
              fi
              sleep "$((attempt * 2))"
            done
          fi
